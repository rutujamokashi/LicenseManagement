name: License Management CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore LicenseManagement.slnx

      - name: Build .NET API
        run: dotnet build LicenseManagement.slnx --configuration Release --no-restore

      - name: Run API tests
        run: dotnet test LicenseManagement.API.Tests/LicenseManagement.API.Tests.csproj --configuration Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: LicenseManagement.UI/package-lock.json

      - name: Install React dependencies
        working-directory: LicenseManagement.UI
        run: npm ci

      - name: Build React application
        working-directory: LicenseManagement.UI
        run: npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API Docker image
        run: docker build -t license-management-api:ci ./LicenseManagement.API

      - name: Build UI Docker image
        run: docker build -t license-management-ui:ci ./LicenseManagement.UI
 
      - name: Tag API Docker image
        run: docker tag license-management-api:ci ghcr.io/${{ github.repository_owner }}/license-management-api:latest

      - name: Tag UI Docker image
        run: docker tag license-management-ui:ci ghcr.io/${{ github.repository_owner }}/license-management-ui:latest

      - name: Push API Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/license-management-api:latest

      - name: Push UI Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/license-management-ui:latest